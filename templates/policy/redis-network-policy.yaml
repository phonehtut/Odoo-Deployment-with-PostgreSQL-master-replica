apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: redis-isolate
  namespace: {{ .Release.Namespace }}
spec:
  podSelector:
    matchLabels:
      app: redis
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: odoo
  egress: []
