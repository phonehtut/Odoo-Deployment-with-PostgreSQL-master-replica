apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: postgres-isolate
  namespace: {{ .Release.Namespace }}
spec:
  podSelector:
    matchLabels:
      app: postgres
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        # Allow Odoo to connect
        - podSelector:
            matchLabels:
              app: odoo
        # Allow replicas to connect to master
        - podSelector:
            matchLabels:
              app: postgres
  egress:
    - to:
        # Allow connections to replicas (for streaming replication if needed)
        - podSelector:
            matchLabels:
              app: postgres
      ports:
        - protocol: TCP
          port: 5432

    - to:
        - podSelector:
            matchLabels:
              app: odoo