apiVersion: v1
kind: Service
metadata:
  name: postgres-master
  namespace: {{ .Release.Namespace }}
spec:
  ports:
    - port: 5432
      targetPort: 5432
  clusterIP: None
  selector:
    app: postgres
    role: master

---
apiVersion: v1
kind: Service
metadata:
  name: postgres-replica
  namespace: {{ .Release.Namespace }}
spec:
  ports:
    - port: 5432
      targetPort: 5432
  clusterIP: None
  selector:
    app: postgres
    role: replica
